# "org" ensures this Service is used with the correct Serverless Framework Access Key.

# serverless.yml
service: aws-tagger

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: dev
  iam:
    role:
      name: ${sls:stage}-aws-tagger-role
      statements:
        - Effect: 'Allow'
          Action:
            - 'ec2:*Tag*'
            - 'lambda:*Tag*'
            - 'eks:*Tag*'
            - 's3:*Tag*'
            - 'rds:*Tag*'
            - 'elbv2:*Tag*'
            - 'dynamodb:*Tag*'
            - 'kms:*Tag*'
            - 'secretsmanager:*Tag*'
            - 'sns:*Tag*'
            - 'sqs:*Tag*'
            - 'logs:*Tag*'
            - 'cloudwatch:*Tag*'
            - 'route53:*Tag*'
            - 'apigateway:*Tag*'
            - 'ecs:*Tag*'
            - 'ecr:*Tag*'
            - 'states:*Tag*'
            - 'elasticfilesystem:*Tag*'
            - 'es:*Tag*'
            - 'redshift:*Tag*'
            - 'cognito-idp:*Tag*'
            - 'cognito-identity:*Tag*'
            - 'amplify:*Tag*'
            - 'cloudfront:*Tag*'
            - 'glue:*Tag*'
            - 'bedrock:*Tag*'
            - 'sagemaker:*Tag*'
            - 'iam:*Tag*'
            - 'efs:*Tag*'
            - 'stepfunctions:*Tag*'
            - 'opensearch:*Tag*'
            - 'autoscaling:*Tag*'
            - 'kafka:*Tag*'
            - 'kinesis:*Tag*'
            - 'batch:*Tag*'
            - 'elasticache:*Tag*'
            - 'memorydb:*Tag*'
            # SSO owner_email lookup (needs IDENTITY_STORE_ID, see README)
            - 'identitystore:GetUserId'
            - 'identitystore:DescribeUser'
          Resource: '*'
        # Slack reminders: bot token SecureString (SLACK_TOKEN_PARAM must live under /aws-tagger/)
        - Effect: 'Allow'
          Action:
            - 'ssm:GetParameter'
          Resource: 'arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/aws-tagger/*'
      managedPolicies:
        - arn:aws:iam::aws:policy/AWSCloudTrail_ReadOnlyAccess
        - arn:aws:iam::aws:policy/ResourceGroupsandTagEditorFullAccess

package:
  individually: true
  exclude:
    - "test/**"
    - "docs/**"
    - "tmp/**"
    - "**/__pycache__/**"
    - ".ruff_cache/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - ".vscode/**"
    - ".env"
    - ".env.*"

functions:
  # A function
  tagger:
    # The file and module for this specific function. Cannot be used with 'image'.
    description: Auto Tagging AWS Resources form CloudTrail for resource creation-time and owner
    handler: src.main.handler
    runtime: python3.12

    timeout: 120
    memorySize: 512
    ephemeralStorageSize: 512
    name: ${sls:stage}-aws-tagger
    environment:
      IDENTITY_STORE_ID: ${env:IDENTITY_STORE_ID, ''}
      IDENTITY_STORE_REGION: ${env:IDENTITY_STORE_REGION, ''}
    events:
    - schedule:
        name: ${sls:stage}-${self:functions.tagger.name}
        description: a description of ${sls:stage}-${self:functions.tagger.name}'s purpose
        # Can also be an array of rate/cron expressions
        rate: rate(24 hours)

  # Optional weekly Slack cleanup reminders: a no-op until SLACK_TOKEN_PARAM is set (see README)
  reminder:
    description: Weekly Slack DM to owners about their AWS resources older than N days
    handler: src.reminder.handler
    runtime: python3.12
    timeout: 300
    memorySize: 256
    name: ${sls:stage}-aws-tagger-reminder
    environment:
      SLACK_TOKEN_PARAM: ${env:SLACK_TOKEN_PARAM, ''}
      SLACK_REGIONS: ${env:SLACK_REGIONS, ''}
      SLACK_FALLBACK_CHANNEL: ${env:SLACK_FALLBACK_CHANNEL, ''}
      SLACK_MIN_AGE_DAYS: ${env:SLACK_MIN_AGE_DAYS, ''}
      SLACK_MESSAGE_TEMPLATE: ${env:SLACK_MESSAGE_TEMPLATE, ''}
    events:
    - schedule:
        name: ${self:functions.reminder.name}
        description: Weekly Slack cleanup reminders, Monday 09:00 IST
        rate: cron(30 3 ? * MON *)

resources:
  Resources:
    # AWS Resource Group for tagged resources
    TaggedResourcesGroup:
      Type: AWS::ResourceGroups::Group
      Properties:
        Name: ${sls:stage}-aws-tagged-resources
        Description: Resource group containing all resources tagged by aws-tagger lambda function
        ResourceQuery:
          Type: TAG_FILTERS_1_0
          Query:
            TagFilters:
              - Key: "created_at"
